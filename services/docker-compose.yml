# Servicios locales del proyecto: MLflow (tracking) y Prefect (orquestación).
# Uso, desde esta carpeta:  docker compose up -d
#   MLflow  -> http://localhost:5000
#   Prefect -> http://localhost:4200
services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.0
    container_name: mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow_store:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --allowed-hosts "localhost:*,127.0.0.1:*,mlflow:*"
    restart: unless-stopped

  prefect:
    image: prefecthq/prefect:3.8.8-python3.12
    container_name: prefect
    ports:
      - "4200:4200"
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_UI_API_URL: http://localhost:4200/api
      PREFECT_HOME: /root/.prefect
    volumes:
      - ./prefect_store:/root/.prefect
    command: prefect server start --host 0.0.0.0 --port 4200
    restart: unless-stopped
