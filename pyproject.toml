[project]
name = "mlops-food-prediction"
version = "0.1.0"
description = "Pipeline MLOps para predecir el comportamiento de pedidos de comida en línea"
authors = [
    {name = "Brandon", email = "hildergalvis@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "prefect (==3.8.8)",
    "mlflow (==3.17.0)",
    "scikit-learn (==1.9.1)",
    "pandas (==3.0.6)",
    "numpy (==2.5.4)",
    "pyyaml (==6.0.3)",
    "fastapi (==0.154.0)"
]


[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (==9.1.1)"
]
