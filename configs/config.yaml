# Configuración del caso de uso: Online Food Ordering (Kaggle srisyra02/online-food-ordering-dataset)
# Todo lo que puede cambiar (datos, modelos, umbrales, MLflow) vive aquí, no en el código.
# Las rutas son relativas a la raíz del repositorio.

data:
  # El CSV no se versiona (data/ está en .gitignore). Ver README para descargarlo.
  raw_path: "data/raw/online food delivery dataset.csv"
  target: "Output"
  clase_positiva: "Yes"   # Output = Yes -> 1 (el cliente vuelve a pedir)
  clase_negativa: "No"    # la usa el drift emulado para cambiar la tasa del objetivo
  # Columnas que se espera encontrar. Si falta "target" el cargue falla;
  # si falta alguna de estas solo se avisa en los logs.
  expected_columns:
    - Age
    - Gender
    - Marital Status
    - Occupation
    - Monthly Income
    - Educational Qualifications
    - Family size
    - Customer Type
    - latitude
    - longitude
    - Pin code
    - Output
    - Feedback

# Hiperparámetros del flow opcional de la actividad 1 (flows/food_flow.py).
train:
  test_size: 0.2
  random_state: 42
  n_estimators: 100

# Actividad 2 ---------------------------------------------------------------

division:
  test_size: 0.25
  random_state: 42        # también se registra como `semilla` en MLflow

# Modelos que compara el flow de entrenamiento. Cada uno es un run de MLflow.
# Solo el de mayor AUC puede pasar a champion.
candidatos:
  - nombre_run: food-logreg
    tipo: logistic_regression
    parametros:
      C: 1.0
      max_iter: 1000
  - nombre_run: food-rf
    tipo: random_forest
    parametros:
      n_estimators: 200
      max_depth: 6
      random_state: 42
  - nombre_run: food-gbt
    tipo: gradient_boosting
    parametros:
      n_estimators: 150
      learning_rate: 0.05
      max_depth: 3
      random_state: 42
  - nombre_run: food-svm      # SVC calibrado (src/modelo.py) para tener probabilidades
    tipo: svm
    parametros:
      C: 1.0
      kernel: rbf
      gamma: scale
      random_state: 42

metricas:
  umbral: 0.5             # probabilidad a partir de la cual se predice Output = Yes

mlflow:
  # MLFLOW_TRACKING_URI, si está definida, tiene prioridad sobre este valor.
  tracking_uri: http://localhost:5000
  experimento: food-prediction-mlops

registro:
  # Nombre en el Model Registry de MLflow. En la A3 se pasó de `food-modelo` a uno nuevo: el
  # champion anterior usaba Feedback (fuga de información) y su AUC no es comparable con el de
  # un modelo sin esa variable, así que la regla de promoción nunca dejaría ganar al modelo honesto.
  nombre_modelo: food-modelo-sin-feedback
  umbral_auc: 0.80             # AUC mínimo para ser champion
  mejora_minima: 0.0           # además debe superar al champion por al menos esto

inferencia:
  tamano_lote: 50              # clientes que se puntúan en cada ejecución (se toman de la parte de prueba)
  carpeta_salida: data/predictions
  cron: "0 6 * * *"            # todos los días a las 06:00 (hora UTC)

# Actividad 3 ---------------------------------------------------------------

# Reglas de calidad de los datos. Se revisan en la ingesta del entrenamiento y de la inferencia.
validacion:
  rangos:                      # [mínimo, máximo] permitidos; la columna además debe ser numérica
    Age: [15, 80]
    Family size: [1, 15]
    latitude: [-90, 90]
    longitude: [-180, 180]
    Pin code: [100000, 999999]
  valores_permitidos:
    Gender: [Male, Female]
    Output: ["Yes", "No"]
  # Nulos: no se permiten en ninguna columna de data.expected_columns.

# Drift emulado (pipeline de inferencia) y detección de drift (pipelines de drift).
# El nivel se fija aquí, no al ejecutar. Valores documentados: 0.0, 0.3 y 0.6.
drift:
  nivel: 0.0                   # 0.0 = sin drift · 0.3 = moderado · 0.6 = fuerte (máximo 1.0)
  semilla: 42                  # mismo lote en cada ejecución; null = lote distinto cada vez
  # Escenario emulado: llegan clientes mayores, empleados y con más ingresos, y vuelven a pedir menos.
  numericas:                   # desplazamiento de la media, en desviaciones estándar, con nivel 1.0
    Age: 2.0
    Family size: 1.0
  categoricas:                 # con nivel 1.0, todas las filas pasan a este valor; con 0.6, el 60 %
    Occupation: Employee
    Monthly Income: More than 50000
  objetivo_invertido: 0.5      # con nivel 1.0, la mitad de los "Yes" pasan a "No"
  carpeta_lotes: data/lotes    # copia de cada lote puntuado, con sus etiquetas reales
  carpeta_reportes: data/reportes_drift
  # Detección
  metodo_numericas: ks         # Kolmogorov-Smirnov (p-valor)
  metodo_categoricas: chisquare  # chi-cuadrado (p-valor)
  umbral_test: 0.05            # una variable tiene drift si el p-valor es menor que esto
  umbral_fraccion: 0.3         # alerta si más del 30 % de las variables tiene drift
  alpha_objetivo: 0.05         # drift de evento si el p-valor de la tasa de "Yes" es menor que esto
  cron: "30 6 * * *"           # 30 minutos después de la inferencia diaria
