# CI: ejecuta la suite de pytest en cada push y en cada Pull Request.
# Los tests no necesitan MLflow, Prefect ni el CSV de Kaggle (los que lo usan se saltan).
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Poetry
        run: pipx install poetry

      - name: Instalar dependencias
        run: poetry install --no-interaction

      - name: Ejecutar tests
        run: poetry run pytest -v
