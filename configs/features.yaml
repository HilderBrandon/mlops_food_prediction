# Variables del experimento. Cambia `seleccion` para elegir el conjunto:
#   ALL     -> todas las variables disponibles, numéricas y categóricas
#   NUMERIC -> solo las numéricas disponibles
#   CUSTOM  -> solo las que aparecen en `custom` (nombres exactos del CSV)
# Cada run registra en MLflow el alias (`features`) y el número de variables (`n_features`).

seleccion: CUSTOM

numericas:
  - Age
  - Family size
  - latitude
  - longitude
  - Pin code

categoricas:
  - Gender
  - Marital Status
  - Occupation
  - Monthly Income
  - Educational Qualifications
  - Customer Type
  - Feedback

# Variables que NO existen cuando hay que predecir (actividad 3, retroalimentación de la A2).
# Feedback es la opinión que el cliente deja después del pedido: usarla para predecir si
# volverá a pedir es fuga de información (data leakage). Se quitan de ALL y NUMERIC, y
# CUSTOM falla si alguna aparece en la lista.
excluidas:
  - Feedback

# Sin las variables de ubicación (latitude, longitude, Pin code) ni Feedback.
custom:
  - Age
  - Family size
  - Gender
  - Marital Status
  - Occupation
  - Monthly Income
  - Educational Qualifications
  - Customer Type
